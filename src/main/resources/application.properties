spring.application.name=movie-ticketing
server.port=8086

# In-memory H2 database, recreated and seeded on every start
spring.datasource.url=jdbc:h2:mem:ticketing;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Expose error messages (e.g. "Seats already booked") to the frontend
server.error.include-message=always

# H2 console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
